name: Android Release

on:
  push:
    branches: [ "master", "testing_purpose", "ui-module" ]
  pull_request:
    branches: [ "master", "testing_purpose", "ui-module" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'   # or omit and use channel: 'stable' to always get latest
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Start APK build
        run: flutter build apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/apk/release/app-release.apk